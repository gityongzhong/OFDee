[package]
name = "ofd-viewer"
version = "1.2.0"
description = "OFD 阅读器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
